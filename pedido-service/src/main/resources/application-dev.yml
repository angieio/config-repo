server:
  port: 8084

spring:
  application:
    name: pedido-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    openfeign:
      client:
        config:
          cliente-service:
            readTimeout: 4000
          producto-service:
            readTimeout: 15000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pedidos_dev}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

empresa:
  ambiente: desarrollo

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

resilience4j:
  circuitbreaker:
    instances:
      productoService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - 'feign.FeignException$NotFound'
  retry:
    instances:
      clienteRetry:
        maxAttempts: 3
        waitDuration: 2s
        ignoreExceptions:
          - 'feign.FeignException$NotFound'
  bulkhead:
    instances:
      productoBulkhead:
        maxConcurrentCalls: 2
        maxWaitDuration: 1s